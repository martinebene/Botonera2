[project]
name = "botonera2-device-bridge"
version = "0.0.0"
description = "Bridge físico Linux y compatibilidad de dispositivos para Botonera2"
requires-python = ">=3.14,<3.15"
dependencies = [
    "evdev>=1.9.3,<2",
]

[project.scripts]
botonera2-device-bridge = "botonera2_device_bridge.cli:ejecutar_cli"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
