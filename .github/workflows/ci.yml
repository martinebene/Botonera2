name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend · calidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          version: '0.12.1'
          python-version: '3.14'
          enable-cache: true
      # La raíz es un proyecto y no un workspace virtual. ``--all-packages``
      # instala también FastAPI y las demás dependencias de cada miembro.
      - run: uv sync --frozen --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      # Comprueba que el snapshot OpenAPI versionado coincide con el backend actual (sin drift)
      - run: uv run python scripts/exportar_openapi.py --check

  backend-tests:
    name: Backend · pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          version: '0.12.1'
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --frozen --all-packages
      - run: uv run pytest

  frontend-quality:
    name: Frontend · calidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Comprueba que los tipos TypeScript coinciden con el snapshot OpenAPI versionado
      - run: pnpm check:types
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  frontend-tests:
    name: Frontend · pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ejecuta las pruebas unitarias y de sincronización/componentes con Vitest
      - run: pnpm test

  frontend-e2e:
    name: Frontend · Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  integration-e2e:
    name: Integración · E2E stack real
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          version: '0.12.1'
          python-version: '3.14'
          enable-cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: uv sync --frozen --all-packages
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Este gate levanta FastAPI y ambas SPA bajo un único origen. Se mantiene
      # separado del E2E frontend para que una falla identifique su frontera real.
      - run: pnpm test:e2e:integrado
      - name: Conservar diagnóstico del E2E integrado
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-integrado-diagnostico
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Frontend · build estático
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  production-package:
    name: Empaquetado · release productiva
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          version: '0.12.1'
          python-version: '3.14'
          enable-cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: uv sync --frozen --all-packages
      - run: pnpm install --frozen-lockfile
      # Nginx se instala solamente en el runner efímero para validar su parser
      # real. ``nginx -t`` intenta abrir el puerto 80 declarado, por eso esta
      # única validación usa sudo dentro del runner descartable. El job no
      # configura servicios ni se conecta a producción.
      - run: sudo apt-get update
      - run: sudo apt-get install --yes nginx
      - run: sudo .venv/bin/python scripts/validar_archivos_despliegue.py
      - run: pnpm empaquetar:produccion
      - name: Smoke desde el artefacto extraído
        run: |
          SHA="$(git rev-parse HEAD)"
          uv run python scripts/validar_release_produccion.py \
            "dist/produccion/botonera2-${SHA}.tar.gz" \
            --checksum "dist/produccion/botonera2-${SHA}.tar.gz.sha256" \
            --sha "${SHA}"
      - name: Publicar paquete y checksum
        uses: actions/upload-artifact@v7
        with:
          name: botonera2-release-${{ github.sha }}
          path: |
            dist/produccion/botonera2-*.tar.gz
            dist/produccion/botonera2-*.tar.gz.sha256
            deploy/herramienta_despliegue.py
          if-no-files-found: error
          retention-days: 30
